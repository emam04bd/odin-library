<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Library</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<section class="book-list">
			<button type="button" id="new-book-btn">
				<div class="plus">+</div>
				<div class="text">Add Book</div>
			</button>
		</section>
		<form class="book-form display-none">
			<h2>New Book</h2>
			<table>
				<tr class="book-title-ip-row">
					<td>
						<label for="book-title-ip">Title</label>
					</td>
					<td>:</td>
					<td class="input-container">
						<input
							class="book-info"
							type="text"
							name="book-title"
							id="book-title-ip"
							placeholder="Arkham Asylum"
							required
						/>
						<div class="error display-none"></div>
					</td>
				</tr>
				<tr class="book-author-ip-row">
					<td>
						<label for="book-author-ip">Author</label>
					</td>
					<td>:</td>
					<td class="input-container">
						<input
							class="book-info"
							type="text"
							name="book-author"
							id="book-author-ip"
							placeholder="James Gordon"
							required
						/>
						<div class="error display-none"></div>
					</td>
				</tr>
				<tr class="book-nop-ip-row">
					<td>
						<label for="book-nop-ip">No of pages</label>
					</td>
					<td>:</td>
					<td class="input-container">
						<input
							class="book-info"
							type="number"
							name="book-nop"
							id="book-nop-ip"
							min="1"
							placeholder="295"
						/>
						<div class="error display-none"></div>
					</td>
				</tr>
				<tr class="book-status-ip-row">
					<td>
						<label for="book-status-ip">Status</label>
					</td>
					<td>:</td>
					<td class="input-container">
						<select
							class="book-info"
							name="book-status"
							id="book-status-ip"
							required
						>
							<option value="Not Started" selected>
								Not Started
							</option>
							<option value="Reading">Reading</option>
							<option value="Complete">Complete</option>
						</select>
						<div class="error display-none"></div>
					</td>
				</tr>
			</table>
			<button type="button" id="add-btn">Add</button>
			<button type="button" id="cancel-btn">Cancel</button>
		</form>
	</body>
	<script src="scripts.js"></script>
</html>
