<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Library</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<section class="book-list">
			<button type="button" id="new-book-btn">
				<div class="plus">+</div>
				<div class="text">Add Book</div>
			</button>
		</section>
		<form class="book-form display-none">
			<h2>New Book</h2>
			<label for="book-title">Title: </label>
			<input
				class="book-info"
				type="text"
				name="book-title"
				id="book-title"
			/>
			<br />
			<label for="book-author">Author: </label>
			<input
				class="book-info"
				type="text"
				name="book-author"
				id="book-author"
			/>
			<br />
			<label for="book-nop">No of pages: </label>
			<input
				class="book-info"
				type="text"
				name="book-nop"
				id="book-nop"
			/>
			<br />
			<label for="book-status">Status: </label>
			<select class="book-info" name="book-status" id="book-status">
				<option value="">Select book status</option>
				<option value="read">Read</option>
				<option value="reading">Reading</option>
			</select>
			<br />
			<button type="button" id="add-btn">Add</button>
			<button type="button" id="close-btn">Close</button>
		</form>
	</body>
	<script src="scripts.js"></script>
</html>
